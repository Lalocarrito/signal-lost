<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Signal Lost</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #unity-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
      #unity-canvas { display: block; background: #000; outline: none; touch-action: none; }
      #unity-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                       color: #fff; font-family: Arial, sans-serif; font-size: 18px; pointer-events: none; }
      #unity-progress { width: 220px; height: 10px; margin-top: 14px; background: #222; border-radius: 6px; overflow: hidden; }
      #unity-progress-fill { width: 0%; height: 100%; background: #ffb03d; transition: width .15s linear; }
      #unity-warning { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); background: #fff; padding: 10px;
                       font-family: Arial, sans-serif; display: none; max-width: 90%; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div>Loading Signal Lost...</div>
        <div id="unity-progress"><div id="unity-progress-fill"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // ---------------- Aspect ratio: 16:9 landscape, 4:3 portrait (letterbox, never stretched) ----------------
      function layoutCanvas() {
        var vw = window.innerWidth, vh = window.innerHeight;
        var target = vh > vw ? (4 / 3) : (16 / 9);   // vertical: 4:3 | horizontal: 16:9
        var w = vw, h = w / target;
        if (h > vh) { h = vh; w = h * target; }
        canvas.style.width = Math.round(w) + "px";
        canvas.style.height = Math.round(h) + "px";
      }
      window.addEventListener("resize", layoutCanvas);
      window.addEventListener("orientationchange", function () { setTimeout(layoutCanvas, 120); });
      layoutCanvas();

      // ---------------- iOS: play even with the silent switch (mute) ON ----------------
      // Safari silences Web Audio when the ringer switch is off. Declaring a "playback" audio session
      // (iOS 16.4+) and playing a silent HTML audio on the first tap moves the game to the media volume.
      var silentAudio = null;
      function makeSilentWav() {
        try {
          var sr = 8000, n = 80;
          var buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
          function w(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
          w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
          v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
          v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
          w(36, "data"); v.setUint32(40, n * 2, true);
          return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
        } catch (e) { return null; }
      }
      function unlockAudio() {
        try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
        try {
          if (!silentAudio) { var url = makeSilentWav(); if (url) silentAudio = new Audio(url); }
          if (silentAudio) { silentAudio.play().catch(function () {}); }
        } catch (e) {}
      }
      unlockAudio();
      ["pointerdown", "touchstart", "mousedown", "keydown"].forEach(function (ev) {
        document.addEventListener(ev, unlockAudio, { capture: true, passive: true });
      });

      // ---------------- iOS: permiso del giroscopio (DeviceMotion) ----------------
      // En iPhone/iPad Safari los sensores solo funcionan si se pide permiso desde un toque del jugador.
      // Se pide una vez, en el primer toque. En Android y PC no hace falta (la funcion no existe).
      var motionAsked = false;
      function askMotionPermission() {
        if (motionAsked) return;
        motionAsked = true;
        try {
          var D = window.DeviceMotionEvent, O = window.DeviceOrientationEvent;
          if (D && typeof D.requestPermission === "function") D.requestPermission().catch(function () {});
          if (O && typeof O.requestPermission === "function") O.requestPermission().catch(function () {});
        } catch (e) {}
      }
      ["click", "touchend"].forEach(function (ev) {
        document.addEventListener(ev, askMotionPermission, { capture: true, passive: true });
      });

      // ---------------- Unity loader ----------------
      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        banner.appendChild(div);
        if (type == "error") div.style.background = "red";
        else if (type == "warning") div.style.background = "yellow";
        banner.style.display = "block";
        if (type != "error") setTimeout(function () {
          if (div.parentNode) banner.removeChild(div);
          banner.style.display = banner.children.length ? "block" : "none";
        }, 5000);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Signal Lost NASA",
        productVersion: "1.0",
        showBanner: unityShowBanner
      };

      var loading = document.querySelector("#unity-loading");
      var progressFill = document.querySelector("#unity-progress-fill");
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          if (progress < 1) {
            loading.style.display = "flex";
            progressFill.style.width = (100 * progress) + "%";
          } else {
            loading.style.display = "none";
          }
          layoutCanvas();
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance;
        }).catch(function (message) {
          unityShowBanner("Error: " + message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
